<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link rel="apple-touch-icon" sizes="76x76" href="../assets/img/apple-icon.png" />
  <link rel="icon" type="image/png" href="../assets/img/favicon.png" />
  <title>Sign Up - Bukoto GuestHouse</title>
  <!-- Fonts and icons -->
  <link href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700,800" rel="stylesheet" />
  <!-- Nucleo Icons -->
  <link href="../assets/css/nucleo-icons.css" rel="stylesheet" />
  <link href="../assets/css/nucleo-svg.css" rel="stylesheet" />
  <!-- Font Awesome Icons -->
  <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>
  <!-- CSS Files -->
  <link id="pagestyle" href="../assets/css/soft-ui-dashboard.css" rel="stylesheet" />
</head>

<body class="bg-gray-100" style="background-color: #333333; background-size: cover; background-position: center;">
  <main class="main-content d-flex align-items-center min-vh-100">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7 col-sm-10">
          <div class="card shadow-lg border-0">
            <div class="card-header bg-gradient-primary p-4 text-center border-0">
              <h1 class="text-white mb-2">Bukoto GuestHouse</h1>
              <p class="text-white-50 mb-0">Property Management System</p>
            </div>
            <div class="card-body p-5">
              <h4 class="mb-1 font-weight-bold text-dark">Create Account</h4>
              <p class="text-muted text-sm mb-4">Sign up to manage your property</p>
              
              <div id="errorAlert" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
                <span id="errorMessage"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>

              <div id="successAlert" class="alert alert-success alert-dismissible fade show d-none" role="alert">
                <span id="successMessage"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>

              <div id="loadingSpinner" class="d-none text-center mb-3">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
              </div>

              <form id="signUpForm">
                <div class="mb-3">
                  <label for="username" class="form-label text-dark font-weight-bold">Username</label>
                  <input type="text" class="form-control" id="username" placeholder="john_doe" required>
                  <small class="text-muted">Minimum 3 characters</small>
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label text-dark font-weight-bold">Email Address</label>
                  <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
                </div>
                
                <div class="mb-3">
                  <label for="password" class="form-label text-dark font-weight-bold">Password</label>
                  <input type="password" class="form-control" id="password" placeholder="Create a password" required>
                  <small class="text-muted">Minimum 6 characters</small>
                </div>

                <div class="mb-3">
                  <label for="confirm-password" class="form-label text-dark font-weight-bold">Confirm Password</label>
                  <input type="password" class="form-control" id="confirm-password" placeholder="Confirm your password" required>
                </div>
                
                <div class="form-check mb-4">
                  <input class="form-check-input" type="checkbox" id="agree" required>
                  <label class="form-check-label text-muted text-sm" for="agree">
                    I agree to the <a href="#" class="text-primary font-weight-bold">Terms and Conditions</a>
                  </label>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 font-weight-bold py-2" id="signUpBtn">Create Account</button>
              </form>
            </div>
            
            <div class="card-footer bg-light text-center border-top py-4">
              <p class="text-muted text-sm mb-0">
                Already have an account? 
                <a href="sign-in.html" class="text-primary font-weight-bold">Sign in here</a>
              </p>
            </div>
          </div>
          
          <div class="text-center mt-4">
            <p class="text-muted text-sm">
              © <script>document.write(new Date().getFullYear())</script> Bukoto GuestHouse. All rights reserved.
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/js/core/popper.min.js"></script>
  <script src="../assets/js/core/bootstrap.min.js"></script>
  <script src="../assets/js/plugins/perfect-scrollbar.min.js"></script>
  <script src="../assets/js/soft-ui-dashboard.min.js"></script>

  <script>
    // Handle sign-up form submission
    document.getElementById('signUpForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const errorAlert = document.getElementById('errorAlert');
      const errorMessage = document.getElementById('errorMessage');
      const successAlert = document.getElementById('successAlert');
      const successMessage = document.getElementById('successMessage');
      const loadingSpinner = document.getElementById('loadingSpinner');
      const signUpBtn = document.getElementById('signUpBtn');

      // Clear alerts
      errorAlert.classList.add('d-none');
      successAlert.classList.add('d-none');

      // Validate passwords match
      if (password !== confirmPassword) {
        errorMessage.textContent = 'Passwords do not match';
        errorAlert.classList.remove('d-none');
        return;
      }

      // Show loading state
      loadingSpinner.classList.remove('d-none');
      signUpBtn.disabled = true;

      try {
        // Send sign-up request to backend
        const response = await fetch('http://localhost:5000/signup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ 
            username: username, 
            email: email, 
            password: password 
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Sign up failed');
        }

        // Show success message
        successMessage.textContent = 'Account created successfully! Redirecting to login...';
        successAlert.classList.remove('d-none');

        // Redirect to sign-in after 2 seconds
        setTimeout(() => {
          window.location.href = 'sign-in.html';
        }, 2000);

      } catch (error) {
        let errorMsg = 'Sign up failed';

        if (error.message === 'Email already registered') {
          errorMsg = 'This email is already registered. Please sign in instead.';
        } else if (error.message === 'Username already taken') {
          errorMsg = 'Username is already taken. Please choose another.';
        } else if (error.message === 'Email, password, and username are required') {
          errorMsg = 'Please fill in all fields.';
        } else if (error.message === 'Password must be at least 6 characters') {
          errorMsg = 'Password must be at least 6 characters.';
        } else if (error.message === 'Username must be at least 3 characters') {
          errorMsg = 'Username must be at least 3 characters.';
        } else if (error.message) {
          errorMsg = error.message;
        }

        errorMessage.textContent = errorMsg;
        errorAlert.classList.remove('d-none');

      } finally {
        // Hide loading state
        loadingSpinner.classList.add('d-none');
        signUpBtn.disabled = false;
      }
    });

    // Check if user is already logged in
    window.addEventListener('load', () => {
      const userToken = localStorage.getItem('userToken');
      if (userToken) {
        // User is logged in, redirect to dashboard
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>

</html>
