<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link rel="apple-touch-icon" sizes="76x76" href="../assets/img/apple-icon.png" />
  <link rel="icon" type="image/png" href="../assets/img/favicon.png" />
  <title>Sign In - Bukoto GuestHouse</title>
  <!-- Fonts and icons -->
  <link href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700,800" rel="stylesheet" />
  <!-- Nucleo Icons -->
  <link href="../assets/css/nucleo-icons.css" rel="stylesheet" />
  <link href="../assets/css/nucleo-svg.css" rel="stylesheet" />
  <!-- Font Awesome Icons -->
  <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>
  <!-- CSS Files -->
  <link id="pagestyle" href="../assets/css/soft-ui-dashboard.css" rel="stylesheet" />
</head>

<body class="bg-gray-100" style="background-image: url('../assets/img/bkg.jpg'); background-attachment: fixed; background-size: cover; background-position: center;">
  <main class="main-content d-flex align-items-center min-vh-100">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7 col-sm-10">
          <div class="card shadow-lg border-0">
            <div class="card-header bg-gradient-primary p-4 text-center border-0">
              <h1 class="text-white mb-2">Bukoto GuestHouse</h1>
              <p class="text-white-50 mb-0">Property Management System</p>
            </div>
            <div class="card-body p-5">
              <h4 class="mb-1 font-weight-bold text-dark">Welcome back</h4>
              <p class="text-muted text-sm mb-4">Sign in to your account to continue</p>
              
              <div id="errorAlert" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
                <span id="errorMessage"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>

              <div id="loadingSpinner" class="d-none text-center mb-3">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
              </div>
              
              <form id="signInForm">
                <div class="mb-3">
                  <label for="email" class="form-label text-dark font-weight-bold">Email Address</label>
                  <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
                </div>
                
                <div class="mb-3">
                  <label for="password" class="form-label text-dark font-weight-bold">Password</label>
                  <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                </div>
                
                <div class="form-check mb-4">
                  <input class="form-check-input" type="checkbox" id="rememberMe">
                  <label class="form-check-label text-muted text-sm" for="rememberMe">
                    Remember me
                  </label>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 font-weight-bold py-2" id="signInBtn">Sign In</button>
              </form>
            </div>
            
            <div class="card-footer bg-light text-center border-top py-4">
              <p class="text-muted text-sm mb-0">
                Don't have an account? 
                <a href="sign-up.html" class="text-primary font-weight-bold">Sign up here</a>
              </p>
            </div>
          </div>
          
          <div class="text-center mt-4">
            <p class="text-muted text-sm">
              © <script>document.write(new Date().getFullYear())</script> Bukoto GuestHouse. All rights reserved.
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>

  <script src="../assets/js/core/popper.min.js"></script>
  <script src="../assets/js/core/bootstrap.min.js"></script>
  <script src="../assets/js/plugins/perfect-scrollbar.min.js"></script>
  <script src="../assets/js/soft-ui-dashboard.min.js"></script>

  <script>
    // Handle sign-in form submission
    document.getElementById('signInForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorAlert = document.getElementById('errorAlert');
      const errorMessage = document.getElementById('errorMessage');
      const loadingSpinner = document.getElementById('loadingSpinner');
      const signInBtn = document.getElementById('signInBtn');

      // Show loading state
      loadingSpinner.classList.remove('d-none');
      signInBtn.disabled = true;
      errorAlert.classList.add('d-none');

      try {
        // Send login request to backend
        const response = await fetch('http://localhost:5000/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email: email, password: password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Login failed');
        }

        // Store user info and token
        localStorage.setItem('userToken', data.token);
        localStorage.setItem('userId', data.uid);
        localStorage.setItem('userEmail', data.email);
        localStorage.setItem('username', data.username);
        localStorage.setItem('userRole', data.role);

        // Redirect to dashboard
        window.location.href = 'dashboard.html';

      } catch (error) {
        let errorMsg = 'Sign in failed';

        if (error.message === 'Invalid email or password') {
          errorMsg = 'Invalid email or password. Please try again.';
        } else if (error.message === 'Email and password are required') {
          errorMsg = 'Please enter both email and password.';
        } else if (error.message) {
          errorMsg = error.message;
        }

        errorMessage.textContent = errorMsg;
        errorAlert.classList.remove('d-none');

      } finally {
        // Hide loading state
        loadingSpinner.classList.add('d-none');
        signInBtn.disabled = false;
      }
    });

    // Check if user is already logged in
    window.addEventListener('load', () => {
      const userToken = localStorage.getItem('userToken');
      if (userToken) {
        // User is logged in, redirect to dashboard
        window.location.href = 'dashboard.html';
      }
    });
  </script>
  <script src="../assets/js/soft-ui-dashboard.min.js"></script>
</body>

</html>
